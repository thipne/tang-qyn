<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Qỳn... ❤️</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- FontAwesome cho icon nhạc -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --bg-color: #fff0f3;
            --text-color: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f3;
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- MÀN HÌNH CHỜ (LOADING) --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out;
        }
        .heart-loader { font-size: 50px; animation: heartbeat 1s infinite; color: var(--primary-color); }
        .loading-text { font-family: 'Dancing Script', cursive; font-size: 1.5rem; margin-top: 15px; color: var(--primary-color); }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* --- NÚT PHÁT NHẠC (ĐĨA THAN) --- */
        .music-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            width: 45px; height: 45px; background: rgba(255,255,255,0.8);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; color: var(--primary-color);
            font-size: 20px; transition: 0.3s;
        }
        .music-btn.playing { animation: spinRecord 3s linear infinite; background: var(--primary-color); color: white; }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        /* --- HIỆU ỨNG TUYẾT RƠI --- */
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        /* BACKGROUND 3D */
        .bg-3d-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            perspective: 1200px; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0.6;
        }
        .bg-3d-spinner {
            position: absolute; top: 50%; left: 50%; width: 150px; height: 220px;
            transform-style: preserve-3d; animation: spin3D 35s linear infinite;
        }
        .bg-photo {
            position: absolute; width: 100%; height: 100%; border-radius: 15px;
            background-size: cover; background-position: center; box-shadow: 0 0 20px rgba(0,0,0,0.3); border: 3px solid rgba(255, 255, 255, 0.8);
        }
        .bg-photo:nth-child(1) { transform: rotateY(0deg) translateZ(220px); }
        .bg-photo:nth-child(2) { transform: rotateY(60deg) translateZ(220px); }
        .bg-photo:nth-child(3) { transform: rotateY(120deg) translateZ(220px); }
        .bg-photo:nth-child(4) { transform: rotateY(180deg) translateZ(220px); }
        .bg-photo:nth-child(5) { transform: rotateY(240deg) translateZ(220px); }
        .bg-photo:nth-child(6) { transform: rotateY(300deg) translateZ(220px); }
        @keyframes spin3D { from { transform: translate(-50%, -50%) rotateX(-5deg) rotateY(0deg); } to { transform: translate(-50%, -50%) rotateX(-5deg) rotateY(360deg); } }

        /* CÁC SECTION CHÍNH */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 240, 243, 0.3); color: white; text-align: center; position: relative; z-index: 1;
        }
        .hero h1 { font-family: 'Dancing Script', cursive; font-size: 4rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); animation: float 3s ease-in-out infinite; color: #ff4d6d; }
        .hero p { font-size: 1.3rem; font-weight: 600; color: #ff4d6d; }
        .scroll-down { position: absolute; bottom: 30px; font-size: 2rem; animation: bounce 2s infinite; color: #ff4d6d; opacity: 0.8; }

        .message-section, .gallery-section, .ending-section { position: relative; z-index: 1; }
        .message-section { padding: 60px 20px; text-align: center; background: white; border-radius: 30px 30px 0 0; margin-top: -30px; box-shadow: 0 -10px 20px rgba(0,0,0,0.05); }
        .message-box { max-width: 500px; margin: 0 auto 30px auto; padding: 25px; background: var(--bg-color); border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: left;}
        .message-box p { font-size: 1.15rem; line-height: 1.8; margin-bottom: 10px; }
        
        /* Con nháy cho Typing Effect */
        .typed-cursor { font-size: 1.2rem; color: var(--primary-color); }

        .gallery-section { padding: 40px 0; overflow: hidden; background: rgba(255, 255, 255, 0.9); }
        .gallery-title { text-align: center; font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: var(--primary-color); margin-bottom: 30px; }
        .swiper { width: 100%; padding-top: 20px; padding-bottom: 50px; }
        .swiper-slide { background-position: center; background-size: cover; width: 280px; height: 380px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); overflow: hidden; position: relative; background-color: #eee; }
        .swiper-slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .photo-caption { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.85); padding: 12px; text-align: center; font-weight: 700; font-size: 1rem; backdrop-filter: blur(5px); color: var(--primary-color);}

        .ending-section { padding: 60px 20px 100px 20px; text-align: center; background: white; border-radius: 30px 30px 0 0; }
        .btn-surprise {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white; border: none; padding: 18px 45px; font-size: 1.3rem; font-family: 'Quicksand', sans-serif; font-weight: 700;
            border-radius: 50px; box-shadow: 0 10px 20px rgba(255, 117, 140, 0.4); cursor: pointer; transition: 0.3s;
        }
        .btn-surprise:active { transform: scale(0.95); }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } 60% { transform: translateY(-10px); } }
        .my-popup-class { border-radius: 25px !important; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỜ -->
    <div id="loader">
        <div class="heart-loader">❤️</div>
        <div class="loading-text">Đang tải yêu thương...</div>
    </div>

    <!-- AUDIO PLAYER (Sửa link nhạc mp3 tùy thích) -->
    <audio id="bgMusic" loop>
        <!-- Tui để sẵn bài Beautiful in White không lời mượt mà -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <div class="music-btn" id="musicToggle" onclick="toggleMusic()">
        <i class="fas fa-music"></i>
    </div>

    <!-- CANVAS TUYẾT RƠI -->
    <canvas id="snow-canvas"></canvas>

    <!-- BACKGROUND 3D -->
    <div class="bg-3d-wrapper">
        <div class="bg-3d-spinner">
            <div class="bg-photo" style="background-image: url('images/1.jpg');"></div>
            <div class="bg-photo" style="background-image: url('images/2.jpg');"></div>
            <div class="bg-photo" style="background-image: url('images/3.jpg');"></div>
            <div class="bg-photo" style="background-image: url('images/4.jpg');"></div>
            <div class="bg-photo" style="background-image: url('images/5.jpg');"></div>
            <div class="bg-photo" style="background-image: url('images/6.jpg');"></div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẦU TIÊN -->
    <section class="hero">
        <h1 data-aos="zoom-in" data-aos-duration="1500">Cho Qỳn nè ❤️</h1>
        <p data-aos="fade-up" data-aos-delay="500" data-aos-duration="1500">Bí mật nhỏ đằng sau mã QR...</p>
        <div class="scroll-down">⬇</div>
    </section>

    <!-- LỜI NHẮN (GÕ CHỮ TỰ ĐỘNG) -->
    <section class="message-section">
        <div class="message-box" data-aos="fade-up" data-aos-duration="1000">
            <p><strong>Hi Qỳn 👋</strong></p>
            <!-- Thẻ span này sẽ được thư viện Typed.js tự động gõ chữ -->
            <span id="typed-text"></span>
        </div>
    </section>

    <!-- ALBUM ẢNH VUỐT -->
    <section class="gallery-section">
        <h2 class="gallery-title" data-aos="zoom-in">Kỷ niệm của tụi mình</h2>
        <div class="swiper mySwiper" data-aos="fade-up" data-aos-duration="1200">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="images/1.jpg" alt="Ảnh 1" /><div class="photo-caption">Ảnh 1 ✨</div></div>
                <div class="swiper-slide"><img src="images/2.jpg" alt="Ảnh 2" /><div class="photo-caption">Ảnh 2 ☀️</div></div>
                <div class="swiper-slide"><img src="images/3.jpg" alt="Ảnh 3" /><div class="photo-caption">Ảnh 3 ☁️</div></div>
                <div class="swiper-slide"><img src="images/4.jpg" alt="Ảnh 4" /><div class="photo-caption">Ảnh 4 😆</div></div>
                <div class="swiper-slide"><img src="images/5.jpg" alt="Ảnh 5" /><div class="photo-caption">Ảnh 5 💖</div></div>
                <div class="swiper-slide"><img src="images/6.jpg" alt="Ảnh 6" /><div class="photo-caption">Ảnh 6 🌟</div></div>
                <div class="swiper-slide"><img src="images/7.jpg" alt="Ảnh 7" /><div class="photo-caption">Ảnh 7 🌸</div></div>
                <div class="swiper-slide"><img src="images/8.jpg" alt="Ảnh 8" /><div class="photo-caption">Ảnh 8 🍀</div></div>
                <div class="swiper-slide"><img src="images/9.jpg" alt="Ảnh 9" /><div class="photo-caption">Ảnh 9 🌻</div></div>
                <div class="swiper-slide"><img src="images/10.jpg" alt="Ảnh 10" /><div class="photo-caption">Ảnh 10 🧸</div></div>
                <div class="swiper-slide"><img src="images/11.jpg" alt="Ảnh 11" /><div class="photo-caption">Ảnh 11 🎈</div></div>
                <div class="swiper-slide"><img src="images/12.jpg" alt="Ảnh 12" /><div class="photo-caption">Ảnh 12 🎀</div></div>
                <div class="swiper-slide"><img src="images/13.jpg" alt="Ảnh 13" /><div class="photo-caption">Ảnh 13 🥰</div></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </section>

    <!-- PHẦN KẾT VÀ NÚT BẤM -->
    <section class="ending-section">
        <h3 data-aos="fade-up" style="margin-bottom: 25px; font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--primary-color);">Tui có cái ni hay lém...</h3>
        <button class="btn-surprise" data-aos="zoom-in" data-aos-delay="300" onclick="showSurprise()">Bấm vô đây nè! 💌</button>
    </section>

    <!-- JS Libraries -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

    <script>
        // 1. Tắt Màn Hình Chờ
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 800);
            }, 1500); // Đợi 1.5s để tạo cảm giác hồi hộp
        });

        // 2. Trình Phát Nhạc
        var music = document.getElementById("bgMusic");
        var musicBtn = document.getElementById("musicToggle");
        var isPlaying = false;
        function toggleMusic() {
            if (isPlaying) { music.pause(); musicBtn.classList.remove("playing"); musicBtn.innerHTML = '<i class="fas fa-music"></i>'; } 
            else { music.play(); musicBtn.classList.add("playing"); musicBtn.innerHTML = '<i class="fas fa-compact-disc"></i>'; }
            isPlaying = !isPlaying;
        }

        // 3. Khởi tạo Scroll AOS
        AOS.init({ once: false, offset: 50 });

        // 4. Khởi tạo Typed.js (Gõ chữ)
        var typed = new Typed('#typed-text', {
            strings: [
                "Không có gì nhiều đâu...<br>Chỉ là tui muốn gom nhặt những điều dễ thương nhất để gửi đến cậu. ^1000",
                "Cảm ơn vì đã luôn ở đó.<br>Hãy cứ luôn vui vẻ và hạnh phúc nhé! ❤️"
            ],
            typeSpeed: 50, backSpeed: 30, loop: true, showCursor: true
        });

        // 5. Khởi tạo Swiper Album 3D
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow", grabCursor: true, centeredSlides: true, slidesPerView: "auto",
            coverflowEffect: { rotate: 20, stretch: 0, depth: 200, modifier: 1, slideShadows: true },
            pagination: { el: ".swiper-pagination" },
            loop: true, autoplay: { delay: 3000, disableOnInteraction: false }
        });

        // 6. Hiệu ứng Tuyết rơi
        const canvas = document.getElementById("snow-canvas");
        const ctx = canvas.getContext("2d");
        let w, h, particles;
        function initSnow() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 4 + 1, d: Math.random() * 50 });
            }
        }
        function drawSnow() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "rgba(255, 117, 140, 0.5)"; // Tuyết màu hồng nhạt
            ctx.beginPath();
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateSnow();
        }
        let angle = 0;
        function updateSnow() {
            angle += 0.01;
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.y += Math.cos(angle + p.d) + 1 + p.r / 2;
                p.x += Math.sin(angle) * 2;
                if (p.x > w + 5 || p.x < -5 || p.y > h) {
                    if (i % 3 > 0) { particles[i] = { x: Math.random() * w, y: -10, r: p.r, d: p.d }; } 
                    else { if (Math.sin(angle) > 0) { particles[i] = { x: -5, y: Math.random() * h, r: p.r, d: p.d }; } else { particles[i] = { x: w + 5, y: Math.random() * h, r: p.r, d: p.d }; } }
                }
            }
        }
        window.addEventListener("resize", initSnow);
        initSnow();
        setInterval(drawSnow, 33);

        // 7. Nút Bất Ngờ
        function showSurprise() {
            var duration = 3 * 1000; var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            setTimeout(() => {
                Swal.fire({
                    title: 'Hmmmm ❤️',
                    text: 'Cảm ơn rất nhiều vì ní giúp tui thấy tui cũng không đáng sợ mấy hehe?',
                    imageUrl: 'https://media.tenor.com/T_11hEEMnE8AAAAi/milk-and-mocha-bear-couple.gif',
                    imageWidth: 200, imageHeight: 200, imageAlt: 'Cute Bear',
                    confirmButtonText: 'Chứ còn gì nữa', showCancelButton: true,
                    cancelButtonText: 'Để tui suy nghĩ nha...',
                    confirmButtonColor: '#ff758c', cancelButtonColor: '#d33',
                    customClass: { popup: 'my-popup-class' },
                    backdrop: `rgba(255, 117, 140, 0.3)`
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({ title: 'Tuyệt vờiii! 🎉', text: 'Nhắn tin cho tớ ngay nhé!', icon: 'success', confirmButtonColor: '#ff758c', customClass: { popup: 'my-popup-class' } });
                    }
                });
            }, 1000);
        }
    </script>
</body>
</html>
